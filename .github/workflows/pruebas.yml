# Verifica la integración de las tres capas en cada push y pull request.
# Si un cambio del firmware, del modelo de Alexa, de las Lambdas o de las políticas rompe a otra capa,
# el pull request queda marcado en rojo antes de fusionarlo.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  lambda:
    name: Lambda vigilante-skill y contratos (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v -rs

  lambdas-nube:
    name: Lambdas de la Nube (almacenamiento y lógica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Solo usan boto3 (sin credenciales: los clientes se reemplazan por dobles) y pytest.
      - run: python -m pip install boto3 pytest

      - name: vigilante-logica (regla de la Nube, RF13)
        working-directory: lambda-logica
        run: python -m pytest -v -rs

      - name: vigilante-almacenamiento (RF10–RF12)
        run: python -m pytest -v -rs lambda-almacenamiento/tests

  firmware:
    name: Firmware (PlatformIO y pruebas C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio

      - name: Compilar el modo local (sin AWS)
        run: pio run -e esp32dev

      - name: Compilar el firmware de la demo (con la plantilla de secretos)
        run: |
          if [ ! -f include/secrets.example.h ] || [ ! -d src/net ]; then
            echo "::error::Faltan src/net/ o include/secrets.example.h: el firmware de la demo no compila"
            exit 1
          fi
          cp include/secrets.example.h include/secrets.h
          pio run -e esp32dev-aws

      # Mismos comandos que test/luciana/run.ps1. ArduinoJson lo descarga el paso "pio run -e esp32dev".
      - name: Pruebas C++ del objeto inteligente (dobles de hardware)
        run: |
          INC="-I test/luciana/stubs -I src -I include -I .pio/libdeps/esp32dev/ArduinoJson/src"
          HW="src/sensors/PirSensor.cpp src/actuators/DoorLock.cpp"
          g++ -std=c++17 -Wall -Wextra $INC test/luciana/test_firmware.cpp $HW \
              src/app/SmartObject.cpp -o test_firmware
          ./test_firmware
          g++ -std=c++17 -Wall -Wextra $INC test/ruben/test_hardware.cpp $HW -o test_hardware
          ./test_hardware

      - name: Pruebas C++ de las reglas del Edge (cierre automático y alarma)
        run: |
          INC="-I test/luciana/stubs -I src -I include -I .pio/libdeps/esp32dev/ArduinoJson/src"
          HW="src/sensors/PirSensor.cpp src/actuators/DoorLock.cpp"
          g++ -std=c++17 -Wall -Wextra $INC test/luciana/test_edge.cpp $HW \
              src/app/SmartObject.cpp src/rules/AutoLockRule.cpp -o test_edge
          ./test_edge
          # test_alarm usa un Buzzer simulado: alarm_stubs/ va primero para que lo encuentre antes que src/.
          g++ -std=c++17 -Wall -Wextra -I test/luciana/alarm_stubs $INC test/luciana/test_alarm.cpp $HW \
              src/app/SmartObject.cpp src/settings/OperatingMode.cpp \
              src/rules/AutoLockRule.cpp src/rules/AlarmRule.cpp -o test_alarm
          ./test_alarm

      - name: Compilar el banco de pruebas del hardware
        run: pio run -d tools/prueba_hardware
