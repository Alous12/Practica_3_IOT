# Corre las pruebas de la Lambda y los contratos entre capas en cada push y pull request.
# Si un cambio del firmware, del modelo de Alexa o de las políticas rompe la integración,
# el pull request queda marcado en rojo antes de fusionarlo.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v -rs
