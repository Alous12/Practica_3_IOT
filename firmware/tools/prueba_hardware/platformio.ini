; Proyecto auxiliar de Ruben (hardware): prueba el PIR y el servo SIN WiFi ni AWS.
; Sirve para la prueba RNF2 y para calibrar los ángulos del servo antes de integrar
; con el firmware de Luciana. Compila los MISMOS PirSensor y DoorLock del firmware.
;
; Uso (desde esta carpeta):
;   pio run -t upload && pio device monitor
; o en VS Code: abrir esta carpeta como proyecto de PlatformIO.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -I../../src
    -I../../include
build_src_filter =
    +<*>
    +<../../../src/sensors/>
    +<../../../src/actuators/>
