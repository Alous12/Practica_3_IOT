<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vigilante Inteligente · Mockups RF15</title>
<!--
  Fuente de los mockups estáticos de los reportes (RF15). No es una aplicación:
  dibuja una pantalla fija de 1440 × 1024 con los datos ilustrativos de
  generar-datos.js. exportar.js la convierte en PNG y SVG.
  Pantallas: mockups.html?p=actividad | puerta | bloqueos
-->
<style>
:root {
  --bg: #f2f3f5; --card: #ffffff; --line: #e3e5e9; --ink: #101318; --ink2: #464c57; --mut: #6b717c;
  --side: #16181d; --side2: #23262d; --grid: #edeef1; --axis: #c9cdd4;
  --voz: #2a78d6; --edge: #eb6834; --nube: #1baf7a; --inicio: #9aa0a8;
  --manual: #6250d6; --automatico: #008300; --bloqueo: #e87ba4;
  --rojo: #d03b3b; --rojo-tx: #b42323; --rojo-bg: #fdeeee;
  --ok: #0c8a35; --ok-bg: #e7f5ec; --amb: #7a5200; --amb-bg: #fff4d6; --amb-borde: #f3d48a;
  --h0: #f1f2f4; --h1: #dfe3e8; --h2: #b9c0ca; --h3: #8b94a2; --h4: #5c6574; --h5: #2f3540;
}
* { box-sizing: border-box; }
body { margin: 0; width: 1440px; height: 1024px; overflow: hidden; display: flex; background: var(--bg); color: var(--ink);
  font: 14px/1.4 Inter, "Segoe UI", Roboto, system-ui, sans-serif; font-feature-settings: "cv11"; }
.icono { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* barra lateral */
.lado { width: 232px; flex: none; background: var(--side); color: #c9ccd3; padding: 22px 14px 18px; display: flex; flex-direction: column; }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; color: #fff; }
.logo .marca { width: 34px; height: 34px; border-radius: 9px; background: #fff; color: var(--side); display: flex; align-items: center; justify-content: center; }
.logo .marca .icono { width: 20px; height: 20px; }
.logo b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.logo span { display: block; font-size: 12px; color: #9a9fa9; }
.nav-tit { font-size: 11.5px; color: #8a909b; padding: 10px 10px 6px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 8px; font-size: 14px; color: #c9ccd3; }
.nav.activo { background: var(--side2); color: #fff; font-weight: 600; }
.nav .icono { width: 17px; height: 17px; }
.lado .relleno { flex: 1; }
.disp { background: var(--side2); border-radius: 10px; padding: 12px; font-size: 12.5px; color: #b9bdc6; }
.disp b { display: block; color: #fff; font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
.disp .ok { display: flex; align-items: center; gap: 6px; color: #7fd69c; }
.punto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* principal */
.main { flex: 1; min-width: 0; padding: 20px 28px 22px; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; gap: 16px; }
.top .tit { margin-right: auto; }
.top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.top p { margin: 2px 0 0; color: var(--mut); font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 13px; color: var(--ink2); white-space: nowrap; }
.chip.ilus { background: var(--amb-bg); border-color: var(--amb-borde); color: var(--amb); font-weight: 600; }

.estado { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.est { padding: 11px 16px; border-left: 1px solid var(--line); min-width: 0; }
.est:first-child { border-left: 0; }
.est .l { font-size: 12px; color: var(--mut); }
.est .v { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 650; margin-top: 2px; white-space: nowrap; }
.est .v .icono { width: 16px; height: 16px; color: var(--ink2); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px 1px 7px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: #fff; white-space: nowrap; }

.conclusion { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.conclusion .ic { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; background: #eef0f3; color: var(--ink2); }
.conclusion .ic .icono { width: 22px; height: 22px; }
.conclusion .txt { flex: 1; min-width: 0; }
.conclusion .t1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.conclusion .t2 { font-size: 13.5px; color: var(--ink2); margin-top: 2px; }
.conclusion.reco { background: #f3f7f5; border-color: #cfe6d9; }
.conclusion.reco .ic { background: var(--ok); color: #fff; }
.accion { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12.5px; color: var(--mut); }
.accion .cambio { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; white-space: nowrap; }

.fila { display: grid; gap: 14px; min-height: 0; }
.fila > .card { min-height: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; min-width: 0; display: flex; flex-direction: column; }
.card h3 { margin: 0; font-size: 14.5px; font-weight: 650; }
.card .sub { font-size: 12.5px; color: var(--mut); margin-top: 1px; }
.cab { display: flex; align-items: flex-start; gap: 12px; }
.cab > div:first-child { margin-right: auto; }
.ley { display: flex; flex-wrap: nowrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink2); }
.ley span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw.l { height: 2px; width: 14px; border-radius: 1px; }

.kpi .l { font-size: 13px; color: var(--ink2); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.kpi .l .icono { width: 16px; height: 16px; color: var(--mut); }
.kpi .v { font-size: 38px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin-top: 8px; }
.kpi .v small { font-size: 16px; font-weight: 600; color: var(--mut); letter-spacing: 0; margin-left: 4px; }
.kpi .c { margin-top: 6px; font-size: 13px; color: var(--mut); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.delta { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 6px; font-weight: 650; font-size: 12.5px; background: #eef0f3; color: var(--ink2); }
.kpi.alerta { background: var(--amb-bg); border-color: var(--amb-borde); }
.kpi.alerta .l, .kpi.alerta .v, .kpi.alerta .c { color: var(--amb); }
.kpi.alerta .l .icono { color: var(--amb); }

.fig { position: relative; flex: 1; min-height: 0; margin-top: 10px; }
.fig svg { position: absolute; inset: 0; overflow: visible; }

table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--mut); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.f { color: var(--ink2); font-variant-numeric: tabular-nums; }
td.m { color: var(--ink2); white-space: normal; }
.org { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; background: #f3f4f6; font-size: 12.5px; font-weight: 600; }
tr.marca-f td { background: var(--amb-bg); }

.barras { display: grid; grid-template-columns: max-content 1fr; gap: 7px 12px; align-items: center; font-size: 13px; margin-top: 10px; }
.barras .nom { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); white-space: nowrap; }
.barras .pista { display: flex; align-items: center; gap: 8px; min-width: 0; }
.barras .b { height: 14px; border-radius: 0 4px 4px 0; }
.barras .num { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nota { font-size: 12px; color: var(--mut); margin-top: auto; padding-top: 8px; }
.pie { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--mut); margin-top: -4px; }
</style>
<script src="generar-datos.js"></script>
</head>
<body>
<aside class="lado">
  <div class="logo">
    <div class="marca"><svg class="icono" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <div><b>Vigilante</b><span>Inteligente · reportes</span></div>
  </div>
  <div class="nav-tit">Reportes</div>
  <div class="nav" data-p="actividad"><svg class="icono" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Actividad del día</div>
  <div class="nav" data-p="puerta"><svg class="icono" viewBox="0 0 24 24"><path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18M15 12h.01"/></svg>Puerta y alarma</div>
  <div class="nav" data-p="bloqueos"><svg class="icono" viewBox="0 0 24 24"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg>Bloqueos y umbral</div>
  <div class="relleno"></div>
  <div class="disp" id="disp"></div>
</aside>
<div class="main" id="main"></div>

<script>
"use strict";
var TZ = -4 * 3600;
var D = generarDatos();
var AHORA = D.ahora, THING = D.thing;
var idx = { lectura: [], deteccion: [], puerta: [], modo: [], alarma: [] };
D.filas.forEach(function (f) { idx[f.tipo].push(f); });
var C = {
  voz: "var(--voz)", edge: "var(--edge)", nube: "var(--nube)", inicio: "var(--inicio)",
  manual: "var(--manual)", automatico: "var(--automatico)", bloqueo: "var(--bloqueo)"
};
var NOM_O = { voz: "Voz (Alexa)", edge: "Edge (ESP32)", nube: "Nube", inicio: "Arranque" };
var NOM_M = { manual: "Manual", automatico: "Automático", bloqueo: "Bloqueo" };
var DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
var ICON = {
  pulso: "M3 12h4l3-8 4 16 3-8h4", reloj: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2",
  candado: "M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4", puerta: "M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18M15 12h.01",
  campana: "M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0",
  silencio: "M13.7 21a2 2 0 0 1-3.4 0M18.6 13A17 17 0 0 1 18 8M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.3-5M2 2l20 20",
  wifi: "M5 12.6a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 20 0M12 20h.01",
  power: "M18.4 6.6a9 9 0 1 1-12.8 0M12 2v10", ok: "M20 6 9 17l-5-5",
  aviso: "M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01",
  luna: "M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z", idea: "M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z",
  cal: "M3 5h18v16H3zM16 3v4M8 3v4M3 10h18", usuario: "M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z",
  escudo: "M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z", ajuste: "M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6",
  tend: "M3 17l6-6 4 4 8-8M14 7h7v7"
};
function ic(n, st) { return '<svg class="icono" viewBox="0 0 24 24"' + (st ? ' style="' + st + '"' : "") + '><path d="' + ICON[n] + '"/></svg>'; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(n, d) { return Number(n).toLocaleString("es-BO", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
function p2(n) { return (n < 10 ? "0" : "") + n; }
function loc(e) { return new Date((e + TZ) * 1000); }
function clave(e) { return loc(e).toISOString().slice(0, 10); }
function ini(c) { return Date.parse(c + "T00:00:00Z") / 1000 - TZ; }
function mas(c, n) { return new Date(Date.parse(c + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10); }
function hora(e, s) { var d = loc(e); return p2(d.getUTCHours()) + ":" + p2(d.getUTCMinutes()) + (s ? ":" + p2(d.getUTCSeconds()) : ""); }
function dia(c, sinSem) { var d = new Date(Date.parse(c + "T00:00:00Z")); return (sinSem ? "" : DIAS[d.getUTCDay()] + " ") + d.getUTCDate() + " " + MESES[d.getUTCMonth()]; }
function fh(e) { return dia(clave(e)) + " · " + hora(e); }
function dur(s) { s = Math.round(s); if (s < 60) return s + " s"; var m = Math.round(s / 60); if (m < 60) return m + " min"; var h = Math.floor(m / 60); return h < 24 ? h + " h" + (m % 60 ? " " + (m % 60) + " min" : "") : Math.floor(h / 24) + " d " + (h % 24) + " h"; }
function entre(l, a, b) { return l.filter(function (f) { return f.epoch >= a && f.epoch < b; }); }
function pill(color, txt) { return '<span class="pill"><span class="punto" style="background:' + color + '"></span>' + esc(txt) + "</span>"; }
function org(o) { return '<span class="org"><span class="punto" style="background:' + (C[o] || C.inicio) + '"></span>' + esc(NOM_O[o] || o) + "</span>"; }
function techo(v) { var p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 4 : n <= 5 ? 5 : 10) * p; }
function pasos(m) { return [4, 5, 2, 3].filter(function (p) { return m % p === 0; })[0] || 4; }
function sv(t, a, txt) {
  var s = "<" + t, st = "";
  for (var k in a) {
    if (/^(fill|stroke)$/.test(k) && String(a[k]).indexOf("var(") === 0) st += k + ":" + a[k] + ";";
    else s += " " + k + '="' + a[k] + '"';
  }
  if (st) s += ' style="' + st + '"';
  return txt == null ? s + "/>" : s + ">" + esc(txt) + "</" + t + ">"; }
function col(x, w, yT, yB, color, round) {
  if (yB - yT <= 0) return "";
  var r = round ? Math.min(4, w / 2, yB - yT) : 0;
  return sv("path", { d: "M" + x + "," + yB + "V" + (yT + r) + "Q" + x + "," + yT + " " + (x + r) + "," + yT + "H" + (x + w - r) + "Q" + (x + w) + "," + yT + " " + (x + w) + "," + (yT + r) + "V" + yB + "Z", fill: color });
}
function ejeY(x0, x1, y, max) {
  var n = pasos(max), s = "";
  for (var i = 0; i <= n; i++) {
    var v = max * i / n, yy = Math.round(y(v)) + .5;
    s += sv("line", { x1: x0, x2: x1, y1: yy, y2: yy, stroke: i ? "var(--grid)" : "var(--axis)", "stroke-width": 1 });
    s += sv("text", { x: x0 - 8, y: yy + 4, "text-anchor": "end", "font-size": 11.5, fill: "var(--mut)" }, fmt(v));
  }
  return s;
}
function dibujar(id, fn) {
  var el = document.getElementById(id), r = el.getBoundingClientRect();
  el.innerHTML = '<svg width="' + r.width + '" height="' + r.height + '" viewBox="0 0 ' + r.width + " " + r.height + '">' + fn(r.width, r.height) + "</svg>";
}

/* ---------- estado ahora (común) ---------- */
var L = idx.lectura[idx.lectura.length - 1];
var edad = AHORA - L.epoch, conectado = edad <= 150;
function estado() {
  var cel = [
    ["Conexión", conectado ? '<span class="punto" style="background:var(--ok);width:9px;height:9px"></span>Conectado' : '<span class="punto" style="background:var(--rojo)"></span>Desconectado'],
    ["Modo", pill(C[L.modo], NOM_M[L.modo])],
    ["Puerta", ic(L.puerta === "abierta" ? "puerta" : "candado") + (L.puerta === "abierta" ? "Abierta" : "Cerrada")],
    ["Alarma", L.alarma === "encendida" ? ic("campana", "color:var(--rojo)") + '<span style="color:var(--rojo-tx)">Sonando</span>' : ic("silencio") + "En silencio"],
    ["Señal WiFi", ic("wifi") + String(L.rssi).replace("-", "−") + " dBm"],
    ["Encendido hace", ic("power") + dur(L.uptime_s)],
    ["Último reporte", ic("reloj") + "hace " + dur(edad)]
  ];
  return '<div class="estado">' + cel.map(function (c) { return '<div class="est"><div class="l">' + c[0] + '</div><div class="v">' + c[1] + "</div></div>"; }).join("") + "</div>";
}
function cabecera(titulo, pregunta, rango) {
  return '<div class="top"><div class="tit"><h1>' + esc(titulo) + "</h1><p>" + esc(pregunta) + "</p></div>" +
    '<span class="chip ilus">' + ic("aviso") + "Datos ilustrativos</span>" +
    '<span class="chip">' + ic("cal") + esc(rango) + "</span>" +
    '<span class="chip">' + ic("escudo") + esc(THING) + "</span></div>";
}
function conclusion(icono, t1, t2, extra, clase) {
  return '<div class="conclusion ' + (clase || "") + '"><div class="ic">' + ic(icono) + '</div><div class="txt"><div class="t1">' + t1 + '</div><div class="t2">' + t2 + "</div></div>" + (extra || "") + "</div>";
}
function kpi(icono, l, v, c, clase) {
  return '<div class="card kpi ' + (clase || "") + '"><div class="l">' + ic(icono) + esc(l) + '</div><div class="v">' + v + '</div><div class="c">' + c + "</div></div>";
}

/* ================= 1 · Actividad del día ================= */
function pActividad() {
  var hoy = clave(AHORA), d0 = ini(hoy), corte = AHORA - d0;
  var dets = entre(idx.deteccion, d0, d0 + 86400);
  var prev = []; for (var i = 1; i <= 6; i++) prev.push(mas(hoy, -i));
  var hastaCorte = 0, porHoraPrev = new Array(24).fill(0);
  prev.forEach(function (c) { var a = ini(c); entre(idx.deteccion, a, a + 86400).forEach(function (f) { porHoraPrev[loc(f.epoch).getUTCHours()]++; if (f.epoch - a < corte) hastaCorte++; }); });
  var prom = hastaCorte / prev.length, promH = porHoraPrev.map(function (x) { return x / prev.length; });
  var horas = []; for (var h = 0; h < 24; h++) horas.push({ manual: 0, automatico: 0, bloqueo: 0, t: 0 });
  dets.forEach(function (f) { var x = horas[loc(f.epoch).getUTCHours()]; x[f.modo]++; x.t++; });
  var pico = horas.reduce(function (a, x, i) { return x.t > horas[a].t ? i : a; }, 0);
  var dif = Math.round((dets.length / prom - 1) * 100);
  var ult = dets[dets.length - 1];
  var cierres = entre(idx.puerta, d0, d0 + 86400).filter(function (f) { return f.puerta === "cerrada" && f.origen === "edge"; }).length;
  var modoPico = ["manual", "automatico", "bloqueo"].reduce(function (a, m) { return horas[pico][m] > horas[pico][a] ? m : a; }, "manual");
  var semana = []; for (var k = 6; k >= 0; k--) { var c = mas(hoy, -k), a0 = ini(c), fila = new Array(24).fill(0); entre(idx.deteccion, a0, a0 + 86400).forEach(function (f) { fila[loc(f.epoch).getUTCHours()]++; }); semana.push({ c: c, h: fila, n: fila.reduce(function (s, x) { return s + x; }, 0) }); }
  var porModo = ["manual", "automatico", "bloqueo"].map(function (m) { return [m, dets.filter(function (f) { return f.modo === m; }).length]; });
  var noche = dets.filter(function (f) { var hh = loc(f.epoch).getUTCHours(); return hh >= 22 || hh < 6; }).length;

  var html = cabecera("Actividad del día", "¿Hay más movimiento de lo normal y a qué hora?", "Hoy · " + dia(hoy) + " 2026, hasta las " + hora(AHORA)) + estado() +
    conclusion(dif <= -15 ? "tend" : "pulso",

      kpi("reloj", "Tiempo medio en bloqueo", dur(medio), "hasta el siguiente cambio de modo") +
      kpi("ajuste", "Umbral actual", cfg.max + '<small>en ' + cfg.ventana + " min</small>", "max_detecciones · ventana_min, sin cambios en la semana") +
    "</div>" +
    '<div class="fila" style="grid-template-columns:1fr 1fr;flex:1">' +
      '<div class="card"><div class="cab"><div><h3>Bloqueos por día</h3><div class="sub">Automático → bloqueo, por la Nube</div></div>' +
        '<div class="ley"><span><span class="sw" style="background:var(--nube)"></span>Bloqueo mantenido</span><span><span class="sw" style="background:#a9e3cc"></span>Revertido en ≤ 10 min</span></div></div><div class="fig" id="gDias"></div></div>' +
      '<div class="card"><h3>¿Cuántos bloqueos habría con otro umbral?</h3><div class="sub">Con la misma ventana de ' + cfg.ventana + ' min y las detecciones de la semana</div><div class="barras" id="gUmbral" style="margin-top:14px;gap:10px 14px"></div>' +
        '<div class="nota">Estimación: incluye las detecciones ocurridas durante cada bloqueo.</div></div>' +
    "</div>" +
    '<div class="card" style="flex:none"><h3>Detalle de los bloqueos</h3><table><thead><tr><th>Inicio</th><th>Detecciones que lo dispararon</th><th class="n">Duración</th><th>Cómo terminó</th><th>Lectura</th></tr></thead><tbody id="tBl"></tbody></table></div>';
  document.getElementById("main").innerHTML = html;
  document.getElementById("tBl").innerHTML = eps.slice().reverse().map(function (e) {
    var falsa = e.dur != null && e.dur <= 600 && e.fin.origen === "voz";
    return '<tr><td class="f">' + fh(e.m.epoch) + "</td><td>" + e.n + " en " + e.c.ventana + " min (umbral " + e.c.max + ')</td><td class="n">' + (e.dur == null ? "en curso" : dur(e.dur)) + "</td><td>" +
      (e.fin ? org(e.fin.origen) + " → " + pill(C[e.fin.modo], NOM_M[e.fin.modo]) : "—") + '</td><td class="m">' + (falsa ? "Probable falsa alarma: se deshizo en minutos" : "Bloqueo sostenido") + "</td></tr>";
  }).join("");
  dibujar("gDias", function (w, hh) {
    var ml = 26, mb = 20, mt = 16, iw = w - ml, ih = hh - mt - mb, max = techo(Math.max(2, Math.max.apply(null, porDia.map(function (x) { return x.n; }))));
    var y = function (v) { return mt + ih - v / max * ih; }, s = ejeY(ml, w, y, max), banda = iw / 7, bw = Math.min(28, banda - 16);
    porDia.forEach(function (x, i) {
      var bx = ml + i * banda + (banda - bw) / 2, util = x.n - x.f;
      if (util) s += col(bx, bw, y(util), y(0), "var(--nube)", !x.f);
      if (x.f) s += col(bx, bw, y(x.n), y(util) - (util ? 2 : 0), "#a9e3cc", true);
      if (x.n) s += sv("text", { x: bx + bw / 2, y: y(x.n) - 6, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "var(--ink)" }, String(x.n));
      s += sv("text", { x: bx + bw / 2, y: hh - 4, "text-anchor": "middle", "font-size": 11.5, fill: "var(--mut)" }, dia(x.c));
    });
    return s;
  });
  var maxW = Math.max.apply(null, whatif.map(function (x) { return x[1]; })) || 1;
  document.getElementById("gUmbral").innerHTML = whatif.map(function (x) {
    var act = x[0] === cfg.max, sug = x[0] === cfg.max + 1, color = act ? "var(--ink2)" : sug ? "var(--ok)" : "var(--h2)";
    return '<span class="nom" style="' + (act || sug ? "color:var(--ink);font-weight:650" : "") + '">' + x[0] + " detecciones" + (act ? " · actual" : sug ? " · sugerido" : "") + "</span>" +
      '<span class="pista">' + (x[1] ? '<span class="b" style="height:16px;width:calc((100% - 90px) * ' + x[1] / maxW + ");background:" + color + '"></span>' : "") +
      '<span class="num">' + x[1] + " bloqueo" + (x[1] === 1 ? "" : "s") + "</span></span>";
  }).join("");
}

var P = new URLSearchParams(location.search).get("p") || "actividad";
document.querySelectorAll(".nav").forEach(function (n) { if (n.dataset.p === P) n.classList.add("activo"); });
document.getElementById("disp").innerHTML = "<b>" + esc(THING) + '</b><div class="ok"><span class="punto" style="background:#4cc477"></span>Conectado · hace ' + dur(edad) + '</div><div style="margin-top:6px">Tabla vigilante_historico<br>Horas de Bolivia (UTC−4)</div>';
({ actividad: pActividad, puerta: pPuerta, bloqueos: pBloqueos })[P]();
</script>
