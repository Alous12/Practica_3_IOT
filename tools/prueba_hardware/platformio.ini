; Proyecto auxiliar de hardware (Ruben): prueba el PIR y el servo SIN WiFi ni AWS.
; Sirve para la prueba RNF2 y para calibrar los ángulos del servo.
; Compila los MISMOS src/sensors y src/actuators del firmware de la raíz, con su config.h.
;
; Uso (desde esta carpeta):
;   pio run -t upload && pio device monitor
; El firmware de la demo NO es este: se carga desde la raíz con el entorno esp32dev-aws.

[env:esp32dev]
; Mismas versiones que el platformio.ini de la raíz.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    madhephaestus/ESP32Servo@1.2.1
build_flags =
    -Wall
    -I../../src
    -I../../include
build_src_filter =
    +<*>
    +<../../../src/sensors/>
    +<../../../src/actuators/>
