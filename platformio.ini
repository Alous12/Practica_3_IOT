; Proyecto original: placa esp32dev conservada.
; Demo: entorno predeterminado esp32dev-aws. esp32dev es diagnóstico local.
[platformio]
default_envs = esp32dev-aws

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -Wall
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    madhephaestus/ESP32Servo@1.2.1

[env:esp32dev]
build_flags = ${env.build_flags} -D FIRMWARE_LOCAL_TEST=1
; El diagnóstico USB no compila los módulos MQTT/TLS.
build_src_filter = +<*> -<net/>

; Demo AWS: completar include/secrets.h local desde la plantilla sin secretos.
[env:esp32dev-aws]
build_flags = ${env.build_flags} -D FIRMWARE_LOCAL_TEST=0
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8
