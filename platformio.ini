; Proyecto original: placa esp32dev conservada.
; Entorno predeterminado LOCAL, sin credenciales ni conexión a AWS.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -Wall
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    madhephaestus/ESP32Servo@1.2.1

[env:esp32dev]
build_flags = ${env.build_flags} -D FIRMWARE_LOCAL_TEST=1

; Requiere integrar net/ y secrets.h de Alejandro. No habilitar sin esa capa.
[env:esp32dev-aws]
build_flags = ${env.build_flags} -D FIRMWARE_LOCAL_TEST=0
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8
